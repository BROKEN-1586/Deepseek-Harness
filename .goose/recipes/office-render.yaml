version: "1.0.0"
title: "Office 渲染闭环（docx/pptx/xlsx → PDF → PNG）"
description: "把生成的 Word / PPT / Excel 用本机 WPS 的 COM 导成 PDF，再渲染成 PNG 供人眼检查版式。补上「写完能自己看一眼」这一环。必须在沙箱外/由 goose 跑（COM 在低完整性里报 0x80080005）；用系统 Python，不是 DSH 自带运行时。"
parameters:
  - key: src
    input_type: string
    requirement: required
    description: "docx / pptx / xlsx 的绝对路径（可多个，空格分隔）"
  - key: dpi
    input_type: string
    requirement: optional
    default: "150"
    description: "PNG 渲染分辨率，看版式 150 够，细看小字用 200"
  - key: pages
    input_type: string
    requirement: optional
    default: ""
    description: "只渲染这些页，例 1-3,5；留空＝全部"
  - key: engine
    input_type: select
    requirement: optional
    default: "wps"
    description: "引擎；本机 Office 的 ProgID 被 WPS 接管，ms 目前等同 wps"
    options:
      - wps
      - ms
prompt: "把 {{ src }} 转成 PDF 并渲染 PNG（dpi={{ dpi }}，页={{ pages }}，引擎={{ engine }}），然后报版式检查结果。"
activities:
  - "我刚生成的 Word 稿，看看版式对不对"
  - "PPT 导成图，我要检查排版"
  - "Excel 表格导 PDF 看看有没有截断"
instructions: |
  固定流程：`{{ src }}` → PDF → PNG（dpi = `{{ dpi }}`，页 = `{{ pages }}`，引擎 = `{{ engine }}`）。

  ## 一条命令
  ```
  python D:\Clearn\tools\office2pdf.py {{ src }} --engine {{ engine }} --png {{ dpi }}{% if pages != "" %} --pages {{ pages }}{% endif %}
  ```
  - **必须用系统 Python**：`C:\Users\36578\AppData\Local\Programs\Python\Python314\python.exe`（有 `win32com` ＋ `fitz`；DSH 自带运行时没有）。
  - 已存在的 PDF 会被跳过，要覆盖加 `--force`。

  ## 为什么必须沙箱外跑
  WPS 是**进程外 COM 服务器**，低完整性令牌起不动它 —— DSH 沙箱内必报 `0x80080005 服务器运行失败`（**T45**）。别重试，换沙箱外或直接由 goose 跑（goose 没有沙箱，天然合适）。

  ## 引擎说明（T46）
  本机 `Word / Excel / PowerPoint.Application` 三个 ProgID 在 HKLM 下都被指向 `wps.exe /Automation`，所以 `--engine ms` **实际仍走 WPS**（脚本会打印 `[!] 注意：…被 WPS 接管了`）。要真用 Office 2021：WPS 配置工具里取消「接管 / 兼容 Office」，之后 `ms` 才有意义。

  ## 判据（缺一条就不算完成）
  1. 命令退出码 0，且打印出 `[ok] <源> → <pdf> · <KB> · <秒>`；
  2. PDF 存在且体积 > 10 KB（异常小 = 导出没成功）；
  3. `--png` 时打印 `pages=N 渲染 M 张`，PNG 文件存在；
  4. 用 `analyze_image` 或直接看图核对三件事：**标题/正文没被截断、表格边框完整、中文与符号没缺字**。

  ## 常见毛病
  - `0x80080005` → 在沙箱里跑了，换环境（见上）。
  - `ModuleNotFoundError: win32com` → 用了 DSH 自带 Python，换系统 Python。
  - PDF 是空的 / 只有一页 → 源文件本身有问题（先确认 WPS 能打开）。

  ## 收尾
  按第五条铁律写备案（含文件台账：源 → PDF → PNG）。

  ## 末行硬校验
  `✅ 渲染完成｜源=<src>｜PDF=<KB>｜页=<N>｜PNG=<M 张>｜版式=标题/表格/中文 均正常`
