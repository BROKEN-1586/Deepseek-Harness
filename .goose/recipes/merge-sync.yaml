# 🔴 2026-10-27 路径变更：旧 `D:\日程规划` 已删、`作业清单` 搬到 `D:\任务清单`。
#   细则见 `D:\Clearn\DEEPCODE.md`「🔴 结构变更（2026-10-27）」。下面出现的旧路径按那张表换算。
version: "1.0.0"
title: "作业/规划 合并同步（真身 ↔ Obsidian 镜像）"
description: "把用户在 Obsidian 镜像里打的勾并回真身（勾选取并集），再对齐两侧；「镜像独有」与「内容差异」只报告不自动合并。默认预演，显式 --apply 才写。覆盖 01-按科目 + 00-作业总览 + D:\\日程规划，不比对 02-按日期。"
parameters:
  - key: mode
    input_type: select
    requirement: optional
    default: "dry-run"
    description: "dry-run＝只预演（默认）；apply＝真正写入两侧"
    options:
      - dry-run
      - apply
  - key: stamp
    input_type: string
    requirement: optional
    default: ""
    description: "回写时间戳，留空＝今天（只到天）。用户报出具体钟点时才写 \"YYYY-MM-DD HH:MM\""
prompt: "按固定流程合并作业清单 / 日程规划的真身与镜像：先预演，判断有无需要人工确认的条目，再决定是否 apply。"
activities:
  - "先预演一遍，看两边勾选差多少"
  - "我在 Obsidian 里勾了几条，合并回真身"
  - "把真身和镜像对齐（apply）"
instructions: |
  固定流程：合并「真身 ↔ Obsidian 镜像」，模式 = {{ mode }}，时间戳 = {{ stamp }}（留空即今天，只到天）。

  ## 路径（自足：子代理看不到父会话历史，别去猜）
  真身（作业）：`C:\Users\36578\Desktop\课程\02-作业\作业清单\`
    - 科目汇总：`01-按科目\`（工科数学分析 / 线性代数 / C语言程序设计 / 人工智能基础与应用 / 通用学术英语）
    - 总览：`00-总览\00-作业总览.md`
  真身（规划）：`D:\日程规划\`
  镜像：`C:\Users\36578\Nutstore\1\我的坚果云\Obsidian\92-作业清单\`、`...\Obsidian\93-日程规划\`
  脚本：`D:\Clearn\tools\merge_and_sync.py`
  Python：`C:\Users\36578\AppData\Local\Programs\Python\Python314\python.exe`
  备份：`...\作业清单\_backup\merge-<时间戳>\`、`D:\日程规划\_backup\merge-<时间戳>\`

  ## 步骤
  1. 预演（除非 {{ mode }} = apply，一律先预演）：
     `[Console]::OutputEncoding=[Text.Encoding]::UTF8; & 'C:\Users\36578\AppData\Local\Programs\Python\Python314\python.exe' 'D:\Clearn\tools\merge_and_sync.py'`
  2. 读汇总：勾选回写 / 镜像独有 / 内容差异 / 时间规范化 各多少条。
  3. 按「硬规则 1、2」决定：直接报结束，还是先列条目等用户点头。
  4. 需要写入时：同一条命令加 `--apply`；用户报了具体钟点就加 `--stamp "YYYY-MM-DD HH:MM"`。
  5. 复核：脚本末尾会打印「复核：两侧一致 ✅」或「仍有 N 行不同 ⚠️」——不一致必须原样报告，不许宣称成功。
  6. 按末行格式汇报，再按第五条铁律往 `D:\AgentData\memory\lessons-recent.md` 顶部追加一条备案。

  ## 硬规则（漏了就会出错，逐条带来源）
  1. **默认只预演**。只有用户明确说「合并 / 同步 / 写进去 / apply」或 {{ mode }} = apply 才加 `--apply`。
     例外：预演结果全为 0（两侧一致）→ 直接报「两侧一致，无需处理」，**不要再补一次 apply**。
  2. **apply 前先拦**：预演里出现「镜像独有」或「内容差异」→ 逐条列给用户判断（要加进真身？还是删镜像那条？），
     点头才写。原因：脚本口径是「内容只认真身」，会**整份覆盖镜像**，把用户在 Obsidian 手改的文字 / 手补的时间冲掉（P13、T18，2026-10-19）。
  3. 勾选方向：只做「镜像已勾、真身未勾 → 回写真身」。反向（真身已勾、镜像未勾）在 apply 时表现为**真身整份覆盖镜像**，
     属预期行为，但必须在报告里点明「镜像被真身覆盖」，不许静默。
  4. 时间戳默认 `✅ YYYY-MM-DD`（用户 2026-10-20 定：只到天）。镜像里已带时分的戳 → 沿用镜像的，不重算。
     用户报具体钟点 → `--apply --stamp "YYYY-MM-DD HH:MM"`。
  5. 全角冒号会自动规范化成半角，**只动 ✅ 时间戳，不动正文**；报告里单列「时间规范化 N 行」。
  6. **不比对 `02-按日期`**（脚本不收集它）。当日清单是快照，只存在真身侧：用户在那里面勾选**无需合并**，
     也不要把 `02-按日期` 复制进 `92-作业清单`。
  7. 「比对 39 对」是正常量级（4 份科目汇总 + 总览 + `D:\日程规划` 全部 md）。数字变了只因为新增/删除文件，**不等于漏扫**。
  8. 不碰滴答清单；不改 `.obsidian` / `obsidian.json`（库注册归用户管，2026-10-20 用户自己修过）；不改 `merge_and_sync.py`
     （改脚本属第四条铁律：先备份、先审批）。
  9. 不手工清空 / 删除 `_backup\merge-*`。
  10. **崩溃 ≠ 没写入**（P14，2026-10-19 用户当场追问过）：报错或超时后，先看 `_backup\merge-<YYYYMMDD-HHMMSS>\` 有没有新目录、
      文件 mtime 有没有变；**绝不许重跑一次拿到「两侧一致」就汇报「这轮没改动」**——重跑只能证明「现在一致」。
  11. 若出现 `UnicodeEncodeError: 'gbk'`（老版本坑 T17，脚本已加 UTF-8 兜底）：用
      `set PYTHONIOENCODING=utf-8 && chcp 65001` 重跑后再判，**不要**判失败；仍按第 10 条查备份目录。
  12. 备份目录里真身与镜像分名存放（`<名>.md` / `<名>-镜像.md`，T19）。看到 `-镜像` 后缀别以为是重名覆盖。
  13. 原生勾选框不带时间戳（T15）：镜像回写的是「检测时间」，汇报时**逐条列出**供用户校正，别当成真实点击时间。

  ## 什么时候用 / 不用
  用：用户说「合并 / 同步一下 / 我在 Obsidian 勾了 / 对齐真身和镜像」；每天复盘前统计「未完成」之前（DEEPCODE：数据源要先合并再判未完成）。
  不用：只想看清单内容（直接读文件）；只想改 `02-按日期` 的勾（真身侧，无需合并）；想推滴答（已废除）。

  ## 末行硬校验（缺一项算未完成）
  `✅ 合并完成｜模式=<dry-run|apply>｜比对=<N> 对｜回写=<N> 条｜镜像独有=<N> 条｜内容差异=<N> 行｜规范化=<N> 行｜复核=<两侧一致 ✅|仍有 N 行不同 ⚠️>`
  回写 / 镜像独有不为 0 时，末行之上必须逐条列出条目原文（截断到 70 字以内）。

  ## 修订记录（同类错第 2 次才升级成上面的硬规则，避免规则膨胀）
  - 2026-10-20 建。依据：`merge_and_sync.py` 源码行为 + 问题汇总 T15/T17/T18/T19/P12–P14。
