version: "1.0.0"
title: "截图 / 课件读取（批量图与扫描版 PDF）"
description: "按规模分流读图：≤5 张 read_image、十几张 analyze_image 分批并行、上百张/整堂课 delegate；PDF 先判扫描版再 OCR。抽取式产出结构化表格，作业信息先核对不落盘。"
parameters:
  - key: target
    input_type: select
    requirement: optional
    default: "当天作业来源"
    description: "读哪一批"
    options:
      - 当天作业来源
      - 当天课件
      - 自定义路径
  - key: path
    input_type: string
    requirement: optional
    default: ""
    description: "自定义路径（target=自定义路径 时必填；可以是文件夹、单文件或逗号分隔多个）"
  - key: ask
    input_type: string
    requirement: optional
    default: ""
    description: "你想从图里要什么（留空＝默认抽取「标题 / 要点 / 公式 / 矩阵 / 结论」）"
prompt: "读取 {{ target }} 这一批截图或 PDF：先按规模选读法，再抽取式汇总成表，作业信息只列不写。"
activities:
  - "读今天这批作业来源，抽成表"
  - "把今天课件的作业页读出来（只读页码题号截止）"
  - "读这个文件夹里的图，只要公式和结论"
instructions: |
  固定流程：读图 / 读扫描版 PDF，目标 = {{ target }}，自定义路径 = {{ path }}，你要的 = {{ ask }}。

  ## 路径（自足：子代理看不到父会话）
  - 当天作业来源：`C:\Users\36578\Desktop\课程\02-作业\作业来源\<日期>\` **＋** `C:\Users\36578\Desktop\课程\02-作业\作业来源\<日期>\`（**两处都扫**；日期目录 `MM-DD` 与 `YYYY-MM-DD` **两种写法都试**，2026-10-20 定）
  - 当天课件：`C:\Users\36578\Desktop\课程\01-课件\*\<YYYY-MM-DD>\`（**通配所有科目目录**）
  - 其它资料：按 {{ path }} 取；相对路径以 `D:\Clearn` 为基准
  - 工具：`analyze_image(path, question)`；`pdf_to_images(pdf, start, end, dpi)`；`read_pdf`；`read_ppt`

  ## 步骤
  1. **先报预算**：数清文件数，告诉用户「共 N 张/页，预计走哪种读法、大约吃多少上下文」（E4：不动 goose 上下文环境变量，重上下文由用户自己决定要不要压缩）。
  2. **判 PDF 类型**（若是 PDF/PPT）：先 `read_pdf` 前 2 页，看开头那行「⚠️ 每页平均 N 字符」——
     **有文本层 → 直接 `read_pdf`（带 `start_page`/`end_page`）**；扫描版（字符数极低）→ 才 `pdf_to_images` 再 `analyze_image`（T4）。
  3. **按规模选读法**（T6，2026-10-11 实测：17 张分 9 轮读明显拖垮整轮）：
     | 规模 | 方式 |
     |---|---|
     | ≤ 5 张，或必须看清版式/图表细节 | `read_image` |
     | 十几张以上 | `analyze_image` **分批并行**（每批 4–6 张） |
     | 上百张 / 整堂课 | `delegate` 子代理，汇总后只回结构 |
  4. **抽取式提问**，别问「描述这张图」：`只写标题 / 要点 / 公式 / 矩阵 / 结论`；{{ ask }} 非空时以它为主。
  5. **重复帧只抓变化**（同一页反复截图），不逐张细读。
  6. 汇总成表输出（见下），**作业信息只列不写**。

  ## 硬规则
  1. **禁止**用 `read_image` 批量读（>5 张）；`read_image` 读进的图**整段会话不释放**，之后每个动作都要重过一遍（O1）。若已经读了一堆，建议用户开新会话/压缩，**别在重会话里硬撑**。
  2. 作业来源 / 课件作业页 → **只列给用户核对，点头才落盘**（P5 / P11，2026-10-14、10-17 定）。**不抄题目内容**。
  3. 课件**按内容（章节号 / 标题）归科**，不按目录名——课件常被放进错的科目目录（2026-10-13 实例：线代课件躺在高数目录）。
  4. 课件正文 → 补充笔记（守「📝 笔记风格」）；**要新建 `.md` 先通知用户**（2026-10-14 口径）。
  5. 不确定的地方标 `❓`，**不许编页码 / 编题号 / 编截止**；看不到就说看不到。
  6. 读到的科目名用正式名（工科数学分析 / 线性代数 / C语言程序设计 / 人工智能基础与应用 / 通用学术英语）。

  ## 输出格式（表头固定）
  `| 来源文件 | 类型 | 科目/章节 | 页码 | 题号 | 截止 | 备注 |`
  末尾单列「**待核对**」：把可能进作业清单的条目按「科目 / 任务 / 截止 / 出处」再复述一遍，等用户点头。

  ## 末行硬校验
  `✅ 读图完成｜文件=<N>｜方式=<read_image|analyze_image|delegate>｜待核对=<N> 条｜未读=<N>`
  `未读` 必须为 0；不为 0 要写明哪几个文件为什么没读（如加密、损坏、格式不支持）。