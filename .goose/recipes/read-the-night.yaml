#   判断细则一律以 `D:\Clearn\DEEPCODE.md`「📥 作业 / 教务清单 + 🔄 同步链路」一节（标题带 `🍳 recipe: read-the-night` 标记）为准。
version: "1.1.0"
title: "读 流水日记 → 任务清单（作业池 + 教务页）"
description: '读当天 流水日记 ＋ 自动扫当天作业来源截图 ＋ 当天课件前几页的作业，结构化分流进 `D:\任务清单`：作业 → `01-作业清单\<科目>-作业汇总.md`；考试 / 课程 / 计划 / 证明等教务类 → `02-教务清单\<页>.md`；课件正文 → 补充笔记（note-rag）。**两条作业线都自动读，但写出文件之前必须先把「科目 / 任务 / 截止 / 出处」列给用户核对（2026-10-14 / 10-17 定）。** 上游只有 流水日记。**不读通知（2026-10-10 废除）、不建滴答任务、不建每日日记页 / 作业快照 / 周计划（2026-10-27 取消）。**'
parameters:
  - key: date
    input_type: string
    requirement: optional
    default: "今天"
    description: "要处理的日期，默认今天（作业来源目录用 MM-DD / YYYY-MM-DD，两种都要试）"
activities:
  - 'message: 读今天 流水日记 ＋ 扫当天作业来源与课件前几页，分流进 D:\任务清单，核对后落盘。'
  - "读今天的 流水日记 并分流"
  - "只补今天的作业池"
instructions: |
  固定流程①：读 流水日记（唯一上游）→ 结构化分流 → 核对 → 落盘 → 同步镜像。

  **总口径**：细则以 `D:\Clearn\DEEPCODE.md`「📥 作业 / 教务清单 + 🔄 同步链路」一节为准（含四行式格式、剩余天数写法、同步盲区）；本节只列执行顺序与路径。

  0. **先跑判据（约 1 秒）**：`python D:\Clearn\tools\daily_gate.py` → 读 `D:\Clearn\_diag\daily-gate.txt` 的 `VERDICT`（FULL / LITE）、未勾数、镜像是否一致、≤3 天风险。**数字以脚本为准，不要自己数。**

  1. **取材**（{{ date }}）：
  - 规划原本（用户手写）：`C:\Users\36578\Nutstore\1\我的坚果云\Obsidian\05-流水日记\`
  - 当天作业来源（**默认自动读，不等用户说**）：`C:\Users\36578\Desktop\课程\02-作业\作业来源\<日期>\` —— 日期目录名有 `MM-DD` 与 `YYYY-MM-DD` 两种写法，**两种都试**；有多处同名目录就都扫
  - 当天课件（**默认自动读**）：`C:\Users\36578\Desktop\课程\01-课件\<科目>\<YYYY-MM-DD>\` —— **通配所有科目目录**（课件常被放进错的科目目录，**按文件内容归科，不按目录名**，2026-10-13 定）；正文用 `python D:\Clearn\tools\cw_extract.py` 抽文字（PDF / PPTX → `_diag\courseware\<tag>.txt`），**不读图、不 OCR**
  - 课件前几页的作业页 → 抄**页码 + 题号 + 截止**，**不抄题干**（2026-10-17 定）
  - ⛔ 不读 `C:\Users\36578\Desktop\通知\`（2026-10-10 废除，用户自处理）

  2. **落点（只认真身 `D:\任务清单\`）**：
  - 作业 → `D:\任务清单\01-作业清单\<科目>-作业汇总.md`（6 个池：C语言程序设计 / 人工智能基础与应用 / 大学生思想文化素养 / 工科数学分析 / 线性代数 / 通用学术英语）
  - 教务类 → `D:\任务清单\02-教务清单\`：`00-考试与教务节点.md` / `01-课程信息.md` / `02-学习计划与冲刺.md` / `03-考前考后清单.md` / `04-证明与教务文件.md` / `05-其它待办与习惯.md`
  - 总入口 → `D:\任务清单\00-总览\00-任务总览.md`（数字由 `syncflow.py` 重算，不手改）
  - 课件正文 → 补充笔记（note-rag 相应学科库），**不进清单**
  - ⛔ **已经没有、别新建也别去找**：每日日记页、`02-按日期` 快照、周计划页、`D:\日程规划` 整库

  3. **六条硬规则**：
  1. 流水日记是**规划原本** —— 用户当天没写的**不要替他编**；写了但读不准，先问。
  2. **作业两条线都自动读**（截图 ＋ 课件前几页），读出「科目 + 章节 + 页码 + 题号 + 截止」**一个不漏**；**读出后不直接落盘**（见第 6 条）。
  3. **清单库是唯一事实** —— 同一件事只落一处，别在作业池和教务页各记一遍；作业不能独立新建在别处。
  4. 读进来必须**结构化整理**（科目 / 任务 / 截止 / 出处），不是原样粘贴。
  5. **🔁 每天先复查、未完成必顺延** —— 数据源＝`daily_gate.py` 的未勾块 ＋ 流水日记里的回顾；统计前**先合并两侧勾选**（Obsidian 镜像可能与真身不一致，见规则 9）。顺延：原样保留科目 + 题号 + 出处，行末标 `（顺延自 MM-DD）`（顺延过多次只写最早那次）；确定不做写 `- [ ] ❌ 放弃：<原因>`；连续顺延 ≥ 7 天标 🔴 并问用户。**不碰滴答清单。**
  6. **🔴 写文件之前必先给用户核对**（2026-10-14 定；10-17 扩到课件）—— 两条作业线照旧自动读，但**落盘前**先把「科目 / 任务 / 截止 / 出处」列在对话里，用户点头（或改完）之后才写。**核对没通过前，不写清单、不同步镜像。**

  4. **写入格式（四行式，一项一栏；要点抄自 DEEPCODE 本节 §3）**：
  ```
  - [ ] 习题 **2.4(A)**：2、4、5、6、7、9…　`《2.4 初等变换与初等矩阵》第 5 页` 📅 2026-10-31
      - [ ] 完成
      - [ ] 提交
      - 截止：🔴 **10-31（还剩 3 天）**
  ```
  - 第 2、3 行勾上时补 `✅ YYYY-MM-DD`（**只到天**，2026-10-20 定）；已完成整体收敛成一行 `- [x] … ✅ 2026-10-19`
  - **缩进 4 空格**；❌ **不许用表格**（Obsidian 表格里的 `[ ]` 点不动，见 `问题汇总` T14）
  - 教务页的考试类条目把「完成 / 提交」记作「**准备 / 赴考**」（2026-10-27 定）
  - 多步作业：作业本身一行，各步骤缩进挂在下面，最后接 `完成 / 提交 / 截止` 三行
  - 科目名用**笔记体系的名字**（写「工科数学分析」，不写「高等数学」）

  5. **截止醒目规则**（剩余天数 = 截止日 − 今天，**每次重算，不许照抄**）：
  逾期 `🔴 **MM-DD（已逾期 N 天）**`｜当天 `🔴 **MM-DD（今天截止）**`｜剩 1–3 天 `🔴 **MM-DD（还剩 N 天）**`｜剩 4–13 天 `⚠️ **MM-DD（还剩 N 天）**`｜剩 ≥14 天 `**MM-DD（还剩 N 天）**`｜未知 `**待确认**`。**只用 🔴 / ⚠️ 两级。** 带截止的顶层行末尾补 Tasks 到期日 `📅 YYYY-MM-DD`（子项不加）。

  6. **🔁 核对通过 → 落盘 → 同步镜像（同一回合内做完，不等用户提）**：
  ```
  python D:\Clearn\tools\merge_and_sync.py            ← 先预演
  python D:\Clearn\tools\merge_and_sync.py --apply    ← 真写（自带备份 + 复制后复核）
  ```
  - 真身 `D:\任务清单\` → 镜像 `Obsidian\92-任务清单\`（14 对文件：6 作业池 ＋ 6 教务页 ＋ `00-任务总览` ＋ `00-作业总览`）
  - 「镜像已勾、真身未勾」→ **回写进真身**并补 `✅ YYYY-MM-DD`（只到天），**不能直接覆盖掉**；「镜像多出条目」或「内容/截止被改」→ **先问用户**
  - 🔴 **预演盲区（`问题汇总` T36）**：预演只覆盖「镜像已勾 → 真身未勾」；「真身已勾、镜像未勾」两边都不报，可能打印「两侧一致」而实际有差 → **一致性以 `daily_gate.py` 为准**
  - 同步完报一句：哪几个文件、几条勾选被回写、有无失败

  7. **边界**：作业内容**不写进学科笔记本体**；不确定先问；✅ 每天主动读课件前几页作业页；❌ **不批量扫课件其余作业页、不批量扫教材、不主动问「要不要补作业」**；用户当次点名某道题时只处理那一道。

  8. **收尾**：按第五条铁律往 `D:\AgentData\memory\lessons-recent.md` 顶部追加一条备案；本轮有有效改动则升版本号（`D:\Clearn\VERSION` ＋ `CHANGELOG.md`）。
